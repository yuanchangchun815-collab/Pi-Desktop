name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Upload the app package to a new GitHub Release. electron-builder reads
      # the tag as the version; needs `GH_TOKEN` (defaults to GITHUB_TOKEN).
      - name: Build & publish release artifacts
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron may need this on headless Linux runners when building AppImage
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os != 'macos-latest' && 'false' || 'true' }}
