name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (main process)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type-check (renderer)
        run: npx tsc -p tsconfig.renderer.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run smoke test
        run: node scripts/smoke-pi.mjs || echo "smoke test skipped (no auth configured)"
